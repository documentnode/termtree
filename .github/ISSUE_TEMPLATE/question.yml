name: Question
description: Ask how something in TermTree works
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The [guide](https://termtree.com/guide/getting-started) covers most of the workflow. If it
        does not answer your question, ask here — and the gap is useful to know about.

        For account, billing, or licence questions, email support@documentnode.io instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TermTree version
      placeholder: "1.0.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Not specific to one platform
