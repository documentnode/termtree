name: Bug report
description: Something in TermTree is broken or behaves unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. TermTree is closed source, so we cannot point you
        at the code — but a clear reproduction lets us find it quickly.

        **Security vulnerabilities do not belong here.** Email support@documentnode.io instead; see
        [SECURITY.md](https://github.com/documentnode/termtree/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a node named ...
        2. Press Cmd+Shift+Enter to launch a terminal
        3. Run ...
        4. The node status stays ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TermTree version
      description: Shown on the splash screen while TermTree starts up.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.2 / Windows 11 23H2 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you running in the terminal?
      description: >
        Which CLI was in the node when this happened — Claude Code, Codex, a shell, a dev server,
        a test run? Many issues are specific to how a particular tool draws its output.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings, or logs
      description: Drag files in directly. Redact anything private first.
